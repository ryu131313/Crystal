<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crystal Web Client</title>
  <link rel="stylesheet" href="/play/play.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1024" height="768"></canvas>
    <div id="hud" hidden>
      <div id="status"></div>
      <div id="chat-log"></div>
      <div id="hud-buttons"><button id="bag-button" title="Inventory (I)">Bag</button></div>
      <form id="chat-form" autocomplete="off"><input id="chat-input" maxlength="200" placeholder="Enter to chat"></form>
    </div>
    <div id="screen"></div>
  </div>
  <script type="module" src="/js/play/main.js"></script>
</body>
</html>
