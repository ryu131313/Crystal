<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crystal Scene Lab</title>
  <style>
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; color: #d8dce6; font: 12px system-ui, Segoe UI, sans-serif; }
    #app { display: flex; height: 100%; }
    #view { position: relative; flex: 1; overflow: hidden; background: #000; cursor: grab; }
    #view.dragging { cursor: grabbing; }
    #view.actual { overflow: auto; }
    #game { position: absolute; left: 0; top: 0; image-rendering: pixelated; transform-origin: 0 0; }
    #status { position: absolute; left: 8px; bottom: 8px; padding: 3px 8px; background: rgba(0, 0, 0, .65); border-radius: 3px; pointer-events: none; font: 11px ui-monospace, Consolas, monospace; white-space: pre; }
    #splitLine { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255, 255, 255, .8); pointer-events: none; }
    #panel { width: 330px; flex: none; overflow-y: auto; background: #12151c; border-left: 1px solid #252a36; padding: 8px 10px 40px; box-sizing: border-box; }
    #panel h1 { font-size: 14px; margin: 2px 0 8px; }
    details { border-top: 1px solid #252a36; padding: 4px 0; }
    summary { cursor: pointer; font-weight: 600; padding: 3px 0; user-select: none; }
    .row { display: grid; grid-template-columns: 108px 1fr 48px; align-items: center; gap: 6px; margin: 3px 0; }
    .row.wide { grid-template-columns: 108px 1fr; }
    .row label { color: #9aa3b5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row input[type=range] { width: 100%; margin: 0; }
    .row input[type=number], .row select, .row input[type=text] { width: 100%; box-sizing: border-box; background: #0b0d12; color: #d8dce6; border: 1px solid #2c3242; border-radius: 3px; padding: 2px 4px; font: inherit; }
    .row .val { text-align: right; font: 11px ui-monospace, Consolas, monospace; color: #c9d1e3; cursor: pointer; }
    .row input[type=color] { width: 100%; height: 20px; padding: 0; border: 1px solid #2c3242; background: none; }
    .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; margin: 4px 0; }
    .checks label { color: #c9d1e3; }
    .buttons { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
    button { background: #232938; color: #d8dce6; border: 1px solid #343c50; border-radius: 3px; padding: 3px 8px; font: inherit; cursor: pointer; }
    button:hover { background: #2c3446; }
    textarea { width: 100%; box-sizing: border-box; height: 110px; background: #0b0d12; color: #c9d1e3; border: 1px solid #2c3242; font: 11px ui-monospace, Consolas, monospace; }
    .hint { color: #788196; font-size: 11px; line-height: 1.4; margin: 4px 0; }
    #msg { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); padding: 8px 14px; background: rgba(0, 0, 0, .75); border-radius: 4px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="view">
      <canvas id="game" width="1024" height="768"></canvas>
      <div id="splitLine" hidden></div>
      <div id="status"></div>
      <div id="msg">Loading…</div>
    </div>
    <div id="panel"></div>
  </div>
  <script type="module" src="../js/play/lab.js"></script>
</body>
</html>
